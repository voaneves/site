name: CI

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Qualidade (lint, tipos, testes, build, orçamento)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Build
        env:
          PUBLIC_SITE_URL: https://voaneves.com
          PUBLIC_GIT_SHA: ${{ github.sha }}
        run: npm run build
      - run: npm run check:budget
      - run: npm run check:html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 3

  e2e-shard:
    name: Playwright (fatia ${{ matrix.shard }}/6)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Six shards balanced by measured spec duration: Playwright's own --shard cuts equal test counts in file order,
      # and the heaviest specs sort first, so its first shard took ~7-10 min while the others took ~1-2.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Cache do Playwright
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache acertado: o navegador já está em ~/.cache/ms-playwright e o runner traz as libs do sistema, então
      # nada de apt-get (o espelho já travou ~5 min aqui). Cache perdido: instala navegador e dependências.
      - name: Instalar Chromium
        timeout-minutes: 8
        env:
          CACHE_HIT: ${{ steps.pw.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-ci-resilience >/dev/null
            npx playwright install --with-deps chromium
          fi

      # Whole spec files per shard, packed by measured duration (scripts/e2e-shard.mjs + e2e/shard-weights.json).
      # O reporter json alimenta scripts/e2e-weights.mjs (recalibração dos pesos) via artefato por fatia.
      - run: npx playwright test --reporter=list,json $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Agrega as fatias sob o nome original do check exigido pelo ruleset.
  e2e-a11y:
    name: Acessibilidade (Playwright + axe)
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Exigir todas as fatias verdes
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "Fatias Playwright: $RESULT"
          [ "$RESULT" = "success" ]

  lighthouse:
    name: Lighthouse (${{ matrix.form }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Cache do LHCI (npx)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm/_npx
          key: npx-lhci-${{ runner.os }}-0.16.1

      - name: LHCI estático (100x4, mediana de 3)
        env:
          LHCI_FORM: ${{ matrix.form }}
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.cjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lhci-${{ matrix.form }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
