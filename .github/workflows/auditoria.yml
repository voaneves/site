name: Auditoria semanal

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditoria:
    name: Auditoria de produção e deriva Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ops
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL || 'https://voaneves.pages.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Deriva Cloudflare (token somente leitura)
        id: drift
        continue-on-error: true
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_AUDIT_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::CLOUDFLARE_AUDIT_TOKEN ou CLOUDFLARE_ZONE_ID não configurado."
            exit 0
          fi
          bash scripts/ops/cf-audit.sh

      - name: Dependências na última versão, sem CVE e com assinaturas válidas
        id: deps
        continue-on-error: true
        run: |
          status=0
          npm outdated || status=1
          npm audit --audit-level=low || status=1
          npm audit signatures || status=1
          exit $status

      - name: Lighthouse em produção
        id: lh
        continue-on-error: true
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.prod.cjs

      - name: Relatórios do Lighthouse de produção
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-prod
          path: .lighthouseci-prod/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Abrir ou comentar issue se houver falha
        if: steps.drift.outcome == 'failure' || steps.deps.outcome == 'failure' || steps.lh.outcome == 'failure'
        env:
          DRIFT: ${{ steps.drift.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          LH: ${{ steps.lh.outcome }}
        run: |
          gh label create audit --color 0E8A16 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '%s\n' \
            "Execução: $run_url" \
            "" \
            "| Auditoria | Resultado |" \
            "|---|---|" \
            "| Deriva Cloudflare | $DRIFT |" \
            "| Dependências | $DEPS |" \
            "| Lighthouse em produção | $LH |" \
            "" \
            'Detalhes nos logs da execução; relatórios do Lighthouse no artefato `lighthouse-prod`.')"
          existing="$(gh issue list --label audit --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label audit --title "🔎 Auditoria semanal" --body "$body"
          fi

      - name: Falhar o job se alguma auditoria falhou
        if: steps.drift.outcome == 'failure' || steps.deps.outcome == 'failure' || steps.lh.outcome == 'failure'
        run: exit 1
